name: Deploy edge functions

# Every push to master that changes an edge function deploys it to Supabase.
# Needs one repository secret: SUPABASE_ACCESS_TOKEN (Supabase account > Access tokens).
# Without it the job only prints a notice, so the site build is never blocked.

on:
  push:
    branches: [master]
    paths: ["supabase/functions/**", ".github/workflows/deploy-connector.yml"]
  workflow_dispatch:

concurrency:
  group: deploy-edge-functions
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: eqguvoaysqspogtdmpun
    steps:
      - uses: actions/checkout@v4

      - name: Check for the access token
        id: token
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::notice::SUPABASE_ACCESS_TOKEN is not set; skipping deploy. Add it under Settings > Secrets and variables > Actions."
            echo "present=false" >> "$GITHUB_OUTPUT"
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: supabase/setup-cli@v1
        if: steps.token.outputs.present == 'true'
        with:
          version: latest

      - name: Stamp the build
        if: steps.token.outputs.present == 'true'
        run: |
          for f in supabase/functions/*/index.ts; do
            sed -i "s/__BUILD_COMMIT__/${GITHUB_SHA::7}/; s/__BUILD_TIME__/$(date -u +%Y-%m-%dT%H:%M:%SZ)/" "$f"
          done

      - name: Deploy every function
        if: steps.token.outputs.present == 'true'
        run: |
          for dir in supabase/functions/*/; do
            name=$(basename "$dir")
            case "$name" in _*) continue;; esac
            [ -f "$dir/index.ts" ] || continue
            echo "Deploying $name"
            supabase functions deploy "$name" --project-ref "$PROJECT_REF" --no-verify-jwt --use-api
          done
